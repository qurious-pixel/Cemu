name: Build Cemu

on:
  workflow_call:
  push:

env:
  VCPKG_ROOT: "${{github.workspace}}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  
jobs:
  build-windows-clang:
    strategy:
      fail-fast: false
      matrix:
        include:
          #- msys2: clang64
          #  arch: x86_64
          #  os: windows-2025
          #  name: x64-mingw-static
          - msys2: clangarm64
            arch: aarch64
            os: windows-11-arm
            name: arm64-mingw-static
    name: build-windows-clang-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    steps:
    - name: "Checkout repo"
      uses: actions/checkout@v6
      with:
        submodules: "recursive"
      
    - name: msys2 path
      if: true
      id: msys2
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        echo "$env:MSYS2_LOCATION"
        echo "D:/a/_temp/msys64/clang64/bin" >> $GITHUB_PATH
      
    - name: Setup msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msys2 }}
        update: true
        cache: true
        install: |
          mingw-w64-clang-${{ matrix.arch }}-clang
          mingw-w64-clang-${{ matrix.arch }}-libc++
          mingw-w64-clang-${{ matrix.arch }}-llvm
          mingw-w64-clang-${{ matrix.arch }}-ccache
          mingw-w64-clang-${{ matrix.arch }}-cmake
          mingw-w64-clang-${{ matrix.arch }}-lld
          mingw-w64-clang-${{ matrix.arch }}-ninja
          mingw-w64-clang-${{ matrix.arch }}-pkgconf
          base-devel
          curl
          git
          zlib
          zstd
          openssl
          fmt
          sed
  
    - name: "Bootstrap vcpkg"
      run: |
        cd dependencies/vcpkg
        git remote add upstream https://github.com/microsoft/vcpkg.git || git remote set-url upstream https://github.com/microsoft/vcpkg.git
        git fetch upstream master
        git reset --hard upstream/master
        ./bootstrap-vcpkg.bat

    - name: 'Setup NuGet Credentials for vcpkg'
      shell: 'bash'
      run: |
        `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
        sources add \
        -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
        -storepasswordincleartext \
        -name "GitHub" \
        -username "${{ github.repository_owner }}" \
        -password "${{ secrets.GITHUB_TOKEN }}"
        `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
        setapikey "${{ secrets.GITHUB_TOKEN }}" \
        -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

    - name: "cmake"
      shell: msys2 {0}
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_FLAGS="-DNOMINMAX" \
          -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld" \
          -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
          -DCMAKE_AR="llvm-ar" \
          -DCMAKE_RANLIB="llvm-ranlib" \
          -DIH264D_ARCHITECTURE=${{ matrix.arch }} \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.name }}

          # -DCMAKE_CXX_FLAGS="-D_NB30_ -DNOMINMAX -DWIN32_LEAN_AND_MEAN -D__DEFINE_CPP_ENUM_FLAG_OPERATORS -Wno-invalid-offsetof" \
          sed -i 's/#if defined(__GNUC__)/#if defined(__GNUC__) && !defined(_WIN32)/g' dependencies/xbyak_aarch64/xbyak_aarch64.h 

    - name: "Build Cemu"
      shell: msys2 {0}
      run: |
        cd build
        cmake --build . --config Release

    - name: "Cemu dependencies"
      shell: msys2 {0}
      run: |
        cd bin
        pwd
        ls -al
        ldd Cemu_release.exe
        ldd Cemu_release.exe | grep -v '/c/Windows' | grep '=> /' | awk '{print $3}' | xargs -I {} cp {} .

    - name: Prepare artifact
      run: Rename-Item bin/Cemu_release.exe Cemu.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: cemu-bin-windows-clang-${{ matrix.arch }}
        path: ./bin

