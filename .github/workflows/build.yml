name: Build Cemu

on:
  workflow_dispatch:
  push:

jobs:
  build-cemu:
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos
    steps:
    - name: Setup dependencies
      run: >
        sudo pacman -Syu --noconfirm &&
        sudo pacman -S --noconfirm --needed base-devel bluez-libs clang cmake freeglut git glm gtk3 libgcrypt libpulse libsecret linux-headers llvm nasm ninja systemd unzip zip
        wayland-protocols lld pugixml sdl3 rapidjson boost-libs boost glslang zstd fmt libzip libpng openssl wget
        && git config --global --add safe.directory '*'

    - name: wxWidgets 3.3
      run: |
        git clone --depth 1 --branch v3.3.0 https://github.com/wxWidgets/wxWidgets.git
        cd wxWidgets
        git submodule update --init --recursive
        cmake -G Ninja -B build_wx -DCMAKE_BUILD_TYPE=Release -DwxBUILD_SHARED=OFF
        cmake --build build_wx --target install --

    - name: Checkout
      uses: actions/checkout@v6
      with:
        repository: cemu-project/Cemu
        ref: main
        submodules: recursive

    - name: "Fetch full history for vcpkg submodule"
      if: false
      run: |
        cd dependencies/vcpkg
        git fetch --unshallow
        git pull --all
        
    - name: "cmake"
      run: |
        cmake -B build -S . -GNinja -DENABLE_VCPKG=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXE_LINKER_FLAGS_INIT="-fuse-ld=lld" -DCMAKE_SHARED_LINKER_FLAGS_INIT="-fuse-ld=lld" -DCMAKE_C_FLAGS_INIT="-flto=thin -g" -DCMAKE_CXX_FLAGS_INIT="-flto=thin -g"
        #cmake -S . -B build ${{ env.BUILD_FLAGS }} -DCMAKE_BUILD_TYPE=release -DVCPKG_BUILD_TYPE=release -DPORTABLE=OFF -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++ -G Ninja -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja
        
    - name: "Build Cemu"
      run: |
        cmake --build build
        
    - name: Prepare artifact
      run: mv bin/Cemu_relwithdebinfo bin/Cemu
              
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: cemu-bin-linux-x64
        path: ./bin/Cemu

    - name: Build AppImage
      run: |
        SHARUN="https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh"
        export ICON=dist/linux/info.cemu.Cemu.png
        export DESKTOP=dist/linux/info.cemu.Cemu.desktop
        export OUTPATH=./
        export OUTNAME=Cemu.AppImage
        wget "$SHARUN" -O ./quick-sharun
        chmod +x ./quick-sharun
        ./quick-sharun ./bin/Cemu
        ./quick-sharun --make-appimage

    - name: Upload Appimage artifact
      uses: actions/upload-artifact@v7
      with:
        name: cemu-appimage-linux-x64
        path: Cemu.AppImage
